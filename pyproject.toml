[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nodecharge"
version = "0.1.0"
description = "Node-charge graph-based online carshare rebalancing with capacitated EV charging (Pantelidis et al., 2022)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["nodecharge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
